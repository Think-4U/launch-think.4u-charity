<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Think.4U — Launch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#1f0606;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}

/* Org name */
.name{font-size:2rem;font-weight:900;color:#fff;margin-bottom:4px;}
.name span{color:#d58d4b;}
.sub{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:#d58d4b;opacity:0.7;margin-bottom:20px;}

/* Headline */
.title{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:800;margin-bottom:6px;line-height:1.3;}
.title i{color:#d58d4b;}
.quote{font-size:0.9rem;color:rgba(255,255,255,0.45);font-style:italic;margin-bottom:40px;}

/* THE BUTTON */
#state-btn{display:flex;flex-direction:column;align-items:center;gap:16px;}

.btn-launch{
  width:130px;
  height:130px;
  border-radius:50%;
  background:linear-gradient(145deg,#f0a860,#d58d4b,#b06820);
  border:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-family:Arial,sans-serif;
  box-shadow:0 0 0 6px rgba(213,141,75,0.25), 0 16px 50px rgba(213,141,75,0.45);
  transition:transform 0.15s;
}
.btn-launch:hover{transform:scale(1.08);}
.btn-launch:active{transform:scale(0.95);}
.btn-icon{font-size:3rem;line-height:1;}
.btn-text{font-size:0.75rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#1f0606;}
.hint{font-size:0.85rem;color:rgba(255,255,255,0.35);}

/* COUNTDOWN */
#state-cd{display:none;flex-direction:column;align-items:center;}
.cd-big{
  font-size:clamp(8rem,28vw,13rem);
  font-weight:900;
  color:#d58d4b;
  line-height:1;
  text-shadow:0 0 60px rgba(213,141,75,0.7);
}
.cd-label{font-size:0.85rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.4);}

/* LAUNCHED */
#state-done{display:none;flex-direction:column;align-items:center;gap:14px;}
.done-icon{font-size:3.5rem;}
.done-title{font-size:clamp(2rem,6vw,3rem);font-weight:900;color:#d58d4b;text-shadow:0 0 40px rgba(213,141,75,0.5);}
.done-desc{font-size:0.95rem;color:rgba(255,255,255,0.65);line-height:1.75;max-width:380px;}
.btn-visit{
  display:inline-block;
  padding:14px 36px;
  background:linear-gradient(135deg,#d58d4b,#b06820);
  color:#1f0606;
  font-weight:800;
  font-size:1rem;
  border-radius:50px;
  text-decoration:none;
  box-shadow:0 8px 28px rgba(213,141,75,0.45);
  font-family:Arial,sans-serif;
}
.btn-visit:hover{opacity:0.9;}
.site-link{font-size:0.8rem;color:rgba(213,141,75,0.6);}
.site-link a{color:inherit;text-decoration:none;}
.btn-reset{
  background:none;border:none;color:rgba(255,255,255,0.3);
  font-size:0.78rem;cursor:pointer;font-family:Arial,sans-serif;
}
.btn-reset:hover{color:rgba(255,255,255,0.6);}

/* confetti */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden;}
.cp{position:absolute;top:-14px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:0;}}
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<!-- Org -->
<div class="name">Think<span>.</span><span>4U</span></div>
<div class="sub">Charitable Trust</div>

<!-- Heading -->
<h1 class="title">Something <i>Meaningful</i><br/>Is About to Begin.</h1>
<p class="quote">"Think. Empower. Uplift."</p>

<!-- STATE 1: BUTTON -->
<div id="state-btn">
  <button class="btn-launch" onclick="startLaunch()">
    <span class="btn-icon">🚀</span>
    <span class="btn-text">Launch</span>
  </button>
  <p class="hint">Press to launch Think.4U</p>
</div>

<!-- STATE 2: COUNTDOWN -->
<div id="state-cd">
  <div class="cd-big" id="cd-num">3</div>
  <div class="cd-label">Launching…</div>
</div>

<!-- STATE 3: LAUNCHED -->
<div id="state-done">
  <div class="done-icon">🎉</div>
  <div class="done-title">Think.4U Is Live!</div>
  <div class="done-desc">The website has been officially launched.<br/><strong>Think.4U Charitable Trust</strong> — where compassion meets action.</div>
  <a class="btn-visit" href="https://think4u.org" target="_blank">🌐 Visit think4u.org</a>
  <div class="site-link"><a href="https://think4u.org" target="_blank">https://think4u.org</a></div>
  <button class="btn-reset" onclick="resetPage()">↺ Reset</button>
</div>

<script>
function show(id){ document.getElementById(id).style.display='flex'; }
function hide(id){ document.getElementById(id).style.display='none'; }

function startLaunch(){
  hide('state-btn');
  show('state-cd');
  tick(3);
}

function tick(n){
  var el = document.getElementById('cd-num');
  el.textContent = n;
  if(n===0){
    el.textContent='GO!';
    setTimeout(function(){ hide('state-cd'); show('state-done'); burst(); }, 800);
  } else {
    setTimeout(function(){ tick(n-1); }, 1000);
  }
}

function resetPage(){
  hide('state-cd');
  hide('state-done');
  document.getElementById('confetti').innerHTML='';
  show('state-btn');
}

var C=['#d58d4b','#f0a85a','#ffffff','#ffe4b5','#c97835','#ffd700'];
function burst(){
  var wrap=document.getElementById('confetti');
  for(var i=0;i<80;i++){
    (function(i){
      setTimeout(function(){
        var p=document.createElement('div');
        p.className='cp';
        var s=7+Math.random()*9;
        var d=2.5+Math.random()*2;
        p.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;background:'+C[Math.floor(Math.random()*C.length)]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';animation-duration:'+d+'s;';
        wrap.appendChild(p);
        setTimeout(function(){if(p.parentNode)p.remove();},d*1000+300);
      },i*30);
    })(i);
  }
}
</script>
</body>
</html>
